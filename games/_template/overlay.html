<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Game — Ally's Stream Hub</title>
  
  <!-- Central Design System & Branding (DO NOT REMOVE) -->
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/speech-bubble.css">
  
  <!-- Game-Specific Stylesheet -->
  <link rel="stylesheet" href="./overlay.css">

  <script src="/socket.io/socket.io.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="overlay-app">
    <!-- 1. Standard Brand Header (Ally Avatar + Speech Bubble) -->
    <header class="brand-card">
      <div class="brand-header-top">
        <div class="brand-avatar-wrap">
          <img src="/ally-avatar.png" alt="Ally" class="brand-avatar">
        </div>
        <div class="avatar-speech-bubble" id="avatarSpeechBubble">
          <span class="speech-bubble-text" id="speechBubbleText">Welcome to the new game! 🎮</span>
        </div>
      </div>
    </header>

    <!-- 2. Sub-Header: Standalone White Pills (Round Left, Topic Center, Timer Right) -->
    <div class="sub-header-row">
      <div class="meta-pill round-pill" id="roundPill">ROUND 1</div>
      <div class="meta-pill topic-pill" id="categoryPill">GENERAL</div>
      <div class="timer-pill" id="timerBox">
        <span class="timer-num" id="timerNum">45</span><span class="timer-unit">s</span>
      </div>
    </div>

    <!-- 3. Standard Rule Banner -->
    <div class="rule-banner">
      <span class="rule-text">TYPE YOUR ANSWER IN CHAT</span>
      <span class="rule-heart">💜</span>
    </div>

    <!-- 4. Game-Specific Main Content Stage -->
    <main class="main-content">
      <section class="glass custom-game-stage" id="gameStage">
        <!-- Injected by overlay.js -->
        <div class="stage-placeholder">Game Canvas / Question Goes Here</div>
      </section>
    </main>

    <!-- 5. Optional Community Streak Pill -->
    <div class="streak-pill" id="streakCard">
      <span class="streak-label">COMMUNITY STREAK</span>
      <div class="streak-val">
        <span class="flame-icon">🔥</span>
        <span class="streak-num" id="streakValue">0</span>
      </div>
    </div>
  </div>

  <script type="module" src="./overlay.js"></script>
</body>
</html>
