<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Riddles — Live Stream Overlay</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="./overlay.css">
  <link rel="stylesheet" href="/speech-bubble.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="overlay-app">
    <!-- Top Header: Consistent with Ally Stream Hub -->
    <header class="brand-card">
      <div class="brand-header-top">
        <div class="brand-avatar-wrap">
          <img src="/ally-avatar.png" alt="Ally" class="brand-avatar">
        </div>
        <div class="avatar-speech-bubble" id="avatarSpeechBubble">
          <span class="speech-bubble-text" id="speechBubbleText">Can you solve this Riddle? 🧙‍♂️</span>
        </div>
      </div>
    </header>

    <!-- Sub Header Row: Standalone White Pills (Round Left, Topic Center, Timer Right) -->
    <div class="sub-header-row">
      <div class="meta-pill round-pill" id="roundPill">ROUND 1</div>
      <div class="meta-pill topic-pill" id="categoryPill">CLASSIC</div>
      <div class="timer-pill" id="timerBox">
        <span class="timer-num" id="timerNum">45</span><span class="timer-unit">s</span>
      </div>
    </div>

    <!-- White Pill Rule Banner -->
    <div class="rule-banner">
      <span class="rule-text">TYPE YOUR ANSWER IN CHAT</span>
      <span class="rule-heart">💜</span>
    </div>

    <!-- Main Content Stage -->
    <main class="main-content">
      <!-- 5-Second Speed Grace Window Alert Banner (Hidden until 1st winner) -->
      <div class="grace-alert-banner" id="graceAlertBanner" style="display: none;">
        <div class="grace-pulse-ring"></div>
        <div class="grace-badge">⚡ SPEED RUN WINDOW</div>
        <div class="grace-text">
          <span id="graceCountdownNum">5</span>s LEFT FOR BONUS SOLVERS! (+50 PTS)
        </div>
      </div>

      <!-- Big Riddle Card -->
      <section class="riddle-stage-card" id="riddleStageCard">
        <div class="card-ambient-glow"></div>
        <div class="riddle-icon-tag" id="riddleEmoji">🧙‍♂️</div>
        <div class="riddle-text-box">
          <p class="riddle-text" id="riddleText">Loading Riddle...</p>
        </div>
      </section>

      <!-- Progressive Mystery Letter Tiles Row -->
      <section class="letter-hint-section" id="letterHintSection">
        <div class="hint-label-row">
          <span class="hint-label">SECRET ANSWER</span>
          <span class="hint-count" id="answerLengthLabel">3 LETTERS</span>
        </div>
        <div class="hint-tiles-wrap" id="hintTilesWrap">
          <!-- Rendered dynamically -->
        </div>
      </section>

      <!-- Optional Semantic Clue Banner -->
      <section class="clue-card" id="clueCard" style="display: none;">
        <span class="clue-tag">💡 CLUE</span>
        <span class="clue-text" id="clueText">Clue text goes here...</span>
      </section>

      <!-- Solved Multi-Winner Celebration Podium Card (Revealed on win) -->
      <section class="celebration-podium-card" id="celebrationCard" style="display: none;">
        <div class="podium-header">
          <span class="podium-trophy">🏆</span>
          <h2 class="podium-title" id="celebrationTitle">RIDDLE SOLVED!</h2>
        </div>
        
        <!-- Secret Answer Reveal Banner -->
        <div class="revealed-answer-box">
          <span class="revealed-label">ANSWER:</span>
          <span class="revealed-word" id="revealedAnswerText">EGG</span>
        </div>

        <!-- Multi-Winner List -->
        <div class="podium-winners-list" id="podiumWinnersList">
          <!-- Winner items rendered dynamically -->
        </div>
      </section>
    </main>

    <!-- Bottom Status & Streak Bar -->
    <footer class="status-footer">
      <div class="streak-pill" id="streakPill">🔥 STREAK 0</div>
      <div class="status-msg" id="statusMessage">Solve the riddle in chat!</div>
    </footer>
  </div>

  <script type="module" src="./overlay.js"></script>
</body>
</html>
