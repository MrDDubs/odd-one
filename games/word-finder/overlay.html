<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Word Finder — Live Stream Overlay</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="./overlay.css">
  <link rel="stylesheet" href="/speech-bubble.css">
  <script src="/socket.io/socket.io.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s);"></script>
</head>
<body>
  <div class="overlay-app">
    <!-- Top Header: Consistent with Hub style -->
    <header class="brand-card">
      <div class="brand-header-top">
        <div class="brand-avatar-wrap">
          <img src="/ally-avatar.png" alt="Ally" class="brand-avatar">
        </div>
        <div class="avatar-speech-bubble" id="avatarSpeechBubble">
          <span class="speech-bubble-text" id="speechBubbleText">Can you find all the hidden words? 🔍</span>
        </div>
      </div>
    </header>

    <!-- Sub Header Row: Standalone White Pills (Round Left, Topic Center, Timer Right) -->
    <div class="sub-header-row">
      <div class="meta-pill round-pill" id="roundPill">ROUND 1</div>
      <div class="meta-pill topic-pill" id="categoryPill">🐾 CUTE ANIMALS</div>
      <div class="timer-pill" id="timerBox">
        <span class="timer-num" id="timerNum">60</span><span class="timer-unit">s</span>
      </div>
    </div>

    <!-- White Pill Rule & Progress Banner (Swipes Every 10s) -->
    <div class="rule-banner rule-banner-carousel" id="ruleBanner">
      <div class="rule-slide slide-rules active" id="ruleSlide1">
        <span class="rule-text">TYPE YOUR ANSWER IN CHAT</span>
        <span class="rule-heart">💜</span>
      </div>
      <div class="rule-slide slide-progress" id="ruleSlide2">
        <span class="rule-text" id="wordsFoundProgressText">0 OF 6 WORDS FOUND</span>
        <span class="rule-heart" id="wordsFoundProgressIcon">🎯</span>
      </div>
    </div>

    <!-- Main Word Finder Board -->
    <main class="main-content">
      <!-- 6x6 Letter Grid with Coordinate Headers -->
      <section class="word-search-board">
        <!-- Top Horizontal Header (Columns 1 to N) -->
        <div class="cols-header" id="colsHeader">
          <span class="col-header-cell">1</span>
          <span class="col-header-cell">2</span>
          <span class="col-header-cell">3</span>
          <span class="col-header-cell">4</span>
          <span class="col-header-cell">5</span>
          <span class="col-header-cell">6</span>
        </div>

        <div class="board-body">
          <!-- Left Vertical Header (Rows A to N) -->
          <div class="rows-header" id="rowsHeader">
            <span class="row-header-cell">A</span>
            <span class="row-header-cell">B</span>
            <span class="row-header-cell">C</span>
            <span class="row-header-cell">D</span>
            <span class="row-header-cell">E</span>
            <span class="row-header-cell">F</span>
          </div>

          <!-- Grid Container (dynamic 6x6, 8x8, 10x10) -->
          <div class="grid-board grid-6x6" id="gridBoard">
            <!-- cells generated via overlay.js -->
          </div>
        </div>
      </section>

      <!-- Scrolling Word Pills (Two Lines Below Puzzle) -->
      <section class="word-pills-section" id="wordPillsSection">
        <div class="word-pills-row scroll-track-1" id="wordPillsRow1">
          <div class="word-pills-track" id="wordPillsTrack1">
            <!-- Line 1 scrolling pills injected via overlay.js -->
          </div>
        </div>
        <div class="word-pills-row scroll-track-2" id="wordPillsRow2">
          <div class="word-pills-track" id="wordPillsTrack2">
            <!-- Line 2 scrolling pills injected via overlay.js -->
          </div>
        </div>
      </section>
    </main>

    <!-- Floating Live Guess Toast -->
    <div id="guessToast" class="guess-toast">
      <span class="toast-icon" id="toastIcon">💬</span>
      <span class="toast-user" id="toastUser">@viewer</span>:
      <strong class="toast-word" id="toastWord">cat</strong>
    </div>

    <!-- 4-Second Round Results Modal -->
    <div class="modal-overlay" id="leaderboardModal">
      <div class="modal-content">
        <div class="modal-title">🏆 THIS ROUND'S POINTS</div>
        
        <!-- Round Winners Podium -->
        <div class="round-winners-row" id="modalPodium">
          <!-- Injected via JS -->
        </div>

        <!-- Also Scored (Below Top 3 Scorers) -->
        <div class="also-scored-section" id="modalAlsoScored" style="display: none;">
          <div class="also-scored-title">✨ ALSO SCORED THIS ROUND</div>
          <div class="also-scored-list" id="modalAlsoScoredList">
            <!-- Injected via JS -->
          </div>
        </div>

        <!-- 4-Second Countdown bar -->
        <div class="countdown-bar-wrap">
          <div class="countdown-bar" id="modalProgressBar"></div>
        </div>
        <div class="countdown-txt">Next puzzle starting automatically...</div>
      </div>
    </div>

    <!-- Full-Screen Cute Confetti & Sparkles Shower -->
    <div id="confettiContainer" class="confetti-container"></div>
  </div>

  <script src="/speech-bubble.js"></script>
  <script src="./overlay.js"></script>
</body>
</html>
