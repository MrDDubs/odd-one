<!-- games/word-finder/controls.html -->
<div class="game-controls-container">
  <!-- Host Secret Cheat Sheet -->
  <div class="card cheat-card">
    <div class="card-title">
      <span>🔍 Host Cheat Sheet (Secret Words &amp; Coordinates)</span>
      <span class="badge badge-purple" style="font-size:10px">Word Finder</span>
    </div>

    <div class="secret-display" style="margin-bottom:14px">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Current Puzzle</div>
        <div class="target-badge" id="wfTopicDisplay" style="font-size:24px">PETS 🐶</div>
        <div style="font-size:12px;color:#cbb2ff;margin-top:4px" id="wfCategoryDisplay">Category: Cute Animals</div>
      </div>
      <div class="target-meta">
        <div>Timer: <strong id="wfTimerText">60s</strong></div>
        <div>Streak: <strong id="wfStreakText">🔥 0</strong></div>
        <div>Found: <strong id="wfFoundCountText">0/7</strong></div>
      </div>
    </div>

    <!-- Target Words & Individual Host Reveals -->
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">
      Hidden Words &amp; Grid Coordinates (Click to Reveal Individually)
    </div>
    <div class="tal-secret-grid" id="wfSecretWordsGrid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));gap:6px;margin-bottom:12px;">
      <!-- Word chips injected via controls.js -->
    </div>
  </div>

  <!-- Round & Timer Management -->
  <div class="card">
    <div class="card-title">Round &amp; Timer Management</div>
    <div class="btn-row">
      <button class="primary" id="wfBtnStartTimer">▶ Start Timer</button>
      <button class="secondary" id="wfBtnPauseTimer">⏸ Pause Timer</button>
      <button class="secondary" id="wfBtnHint">💡 Give Hint</button>
      <button class="secondary" id="wfBtnRevealAll">👁 Reveal All</button>
      <button class="secondary" id="wfBtnHideUnsolved">🙈 Hide Unsolved</button>
      <button class="secondary" id="wfBtnNextPuzzle">⏭ Next Puzzle</button>
      <button class="danger" id="wfBtnResetGame">🔄 Reset Game</button>
    </div>
  </div>

  <!-- Curated Puzzles Library -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Curated Puzzles Library (1,000 Puzzles)</span>
      <span class="badge badge-purple" id="wfPuzzleCountBadge">1,000 Puzzles</span>
    </div>

    <!-- Category Filter & Search Bar -->
    <div class="input-row" style="margin-bottom:10px;gap:8px">
      <div class="form-group" style="flex:1.2">
        <label for="wfCategoryFilter">📁 Category Filter</label>
        <select id="wfCategoryFilter">
          <option value="ALL">🌟 All Categories (1,000)</option>
        </select>
      </div>
      <div class="form-group" style="flex:1.8">
        <label for="wfSearchInput">🔍 Quick Search Puzzle / Word</label>
        <div style="position:relative">
          <input type="text" id="wfSearchInput" placeholder="Filter by word or topic (e.g. Pizza, Kitten, Beach)..." />
          <button id="wfBtnClearSearch" type="button" class="btn-clear-input" style="display:none">✕</button>
        </div>
      </div>
    </div>

    <!-- Filtered Puzzles Dropdown -->
    <div class="form-group" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <label for="wfPuzzleSelect" style="margin:0">Select Topic to Load</label>
        <span id="wfFilteredCountText" style="font-size:11px;color:#c084fc;font-weight:700">1,000 available</span>
      </div>
      <select id="wfPuzzleSelect" style="font-size:12px;padding:8px">
        <option value="">Loading topics...</option>
      </select>
    </div>

    <div class="btn-row">
      <button class="primary" id="wfBtnLoadPuzzle" style="flex:1">📚 Load Selected Topic</button>
      <button class="secondary" id="wfBtnRandomPuzzle" style="flex:1">🎲 Random from Category</button>
    </div>
  </div>
</div>
