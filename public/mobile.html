<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Mobile Stream Layout</title>
  <style>
    body, html {
      margin: 0; 
      padding: 0;
      width: 1080px; 
      height: 1920px;
      overflow: hidden;
      background: #000;
      font-family: 'Fredoka', sans-serif;
    }
    
    .mobile-stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-image: url('./assets/mobile-bg.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Since the user uploaded JPGs with black backgrounds, we use screen to make the black transparent */
    .top-banner {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px; /* fills most of top width */
      height: auto;
      z-index: 10;
      mix-blend-mode: screen; 
    }

    .bao-mascot {
      position: absolute;
      bottom: 250px;
      right: 50px;
      width: 380px;
      height: auto;
      z-index: 15;
      mix-blend-mode: screen;
      animation: floatBao 3s ease-in-out infinite alternate;
    }

    @keyframes floatBao {
      0% { transform: translateY(0px) rotate(-3deg) scale(1); }
      100% { transform: translateY(-20px) rotate(5deg) scale(1.05); }
    }

    /* Game and Leaderboard Layer */
    .content-layer {
      position: absolute;
      top: 500px; /* positioned below the massive top banner */
      left: 0;
      width: 1080px;
      height: 1420px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 5;
    }

    .game-wrapper {
      position: relative;
      width: 710px; /* 1080 * 0.65 scale = ~702px */
      height: 1260px; /* 1920 * 0.65 = ~1248px */
      overflow: hidden;
    }

    .game-iframe {
      width: 1080px;
      height: 1920px;
      border: none;
      transform-origin: 0 0;
      transform: scale(0.65);
      background: transparent;
    }

    .leaderboard-wrapper {
      position: relative;
      width: 320px; /* Enough to comfortably fit the 260px leaderboard */
      height: 1260px;
      display: flex;
      justify-content: flex-start;
      margin-top: 10px; /* slight offset so they align nicely */
    }

    .leaderboard-iframe {
      width: 280px; /* Slightly wider to prevent scrollbars */
      height: 900px;
      border: none;
      background: transparent;
      transform-origin: top left;
      transform: scale(1.1); /* make leaderboard slightly chunkier */
    }
  </style>
</head>
<body>
  <div class="mobile-stage">
    <!-- Background is set in CSS -->

    <!-- Elements -->
    <img src="./assets/mobile-banner.jpg" class="top-banner" />
    
    <div class="content-layer">
      <!-- Embedded Game -->
      <div class="game-wrapper">
        <iframe src="/overlay" class="game-iframe"></iframe>
      </div>
      
      <!-- Embedded Leaderboard -->
      <div class="leaderboard-wrapper">
        <iframe src="/leaderboard" class="leaderboard-iframe"></iframe>
      </div>
    </div>

    <!-- Bao -->
    <img src="./assets/mobile-bao.jpg" class="bao-mascot" />
  </div>
</body>
</html>
