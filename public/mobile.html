<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Mobile Stream Layout</title>
  <style>
    body, html {
      margin: 0; 
      padding: 0;
      width: 1080px; 
      height: 1920px;
      overflow: hidden;
      background: #000;
      font-family: 'Fredoka', sans-serif;
    }
    
    .mobile-stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-image: url('./assets/mobile-bg.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Since the user uploaded JPGs with black backgrounds, we use screen to make the black transparent */
    .top-banner {
      position: absolute;
      top: 10px; /* Moved up */
      left: 50%;
      transform: translateX(-50%);
      width: 750px; /* Made banner much smaller */
      height: auto;
      z-index: 10;
      mix-blend-mode: screen; 
    }

    .bao-mascot {
      position: absolute;
      bottom: 250px;
      right: 50px;
      width: 250px; /* Shrunk bao a bit too */
      height: auto;
      z-index: 15;
      mix-blend-mode: screen;
      animation: floatBao 3s ease-in-out infinite alternate;
    }

    @keyframes floatBao {
      0% { transform: translateY(0px) rotate(-3deg) scale(1); }
      100% { transform: translateY(-20px) rotate(5deg) scale(1.05); }
    }

    /* Game and Leaderboard Layer */
    .content-layer {
      position: absolute;
      top: 340px; /* Tucked closer to the banner */
      left: 30px;
      width: 1020px;
      height: 1200px;
      display: flex;
      justify-content: space-between; /* push game to left, leaderboard to right */
      align-items: flex-start;
      z-index: 5;
    }

    .game-wrapper {
      position: relative;
      width: 648px; /* 1080 * 0.6 scale */
      height: 1152px; /* 1920 * 0.6 scale */
      overflow: hidden;
      border-radius: 40px; /* smooth corners */
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .game-iframe {
      width: 1080px;
      height: 1920px;
      border: none;
      transform-origin: 0 0;
      transform: scale(0.6);
      background: transparent;
    }

    .leaderboard-wrapper {
      position: relative;
      width: 338px; /* 260 * 1.3 scale */
      height: 1152px;
    }

    .leaderboard-iframe {
      width: 260px; 
      height: 850px;
      border: none;
      background: transparent;
      transform-origin: top left;
      transform: scale(1.3); /* scale leaderboard up slightly to match game height */
    }
  </style>
</head>
<body>
  <div class="mobile-stage">
    <!-- Background is set in CSS -->

    <!-- Elements -->
    <img src="./assets/mobile-banner.jpg" class="top-banner" />
    
    <div class="content-layer">
      <!-- Embedded Game -->
      <div class="game-wrapper">
        <iframe src="/overlay" class="game-iframe"></iframe>
      </div>
      
      <!-- Embedded Leaderboard -->
      <div class="leaderboard-wrapper">
        <iframe src="/leaderboard" class="leaderboard-iframe"></iframe>
      </div>
    </div>

    <!-- Bao -->
    <img src="./assets/mobile-bao.jpg" class="bao-mascot" />
  </div>
</body>
</html>
