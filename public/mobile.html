<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Mobile Stream Layout</title>
  <style>
    body, html {
      margin: 0; 
      padding: 0;
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Fredoka', sans-serif;
    }
    
    .mobile-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-image: url('./assets/mobile-bg.jpg');
      background-size: cover;
      background-position: center;
      transform-origin: 0 0;
    }

    /* We'll remove mix-blend-mode so it's not transparent, but note this will show the black background if they are JPGs */
    .top-banner {
      position: absolute;
      top: 10px; 
      left: 50%;
      transform: translateX(-50%);
      width: 750px; 
      height: auto;
      z-index: 10;
    }

    .bao-mascot {
      position: absolute;
      bottom: 20px; /* Pushed all the way to bottom right */
      right: 20px;
      width: 250px;
      height: auto;
      z-index: 15;
      animation: floatBao 3s ease-in-out infinite alternate;
    }

    @keyframes floatBao {
      0% { transform: translateY(0px) rotate(-3deg) scale(1); }
      100% { transform: translateY(-20px) rotate(5deg) scale(1.05); }
    }

    /* Game and Leaderboard Layer */
    .content-layer {
      position: absolute;
      top: 450px; 
      left: 0;
      width: 1080px;
      height: 1000px;
      display: flex;
      justify-content: space-between; 
      align-items: flex-start;
      z-index: 5;
    }

    .game-wrapper {
      position: relative;
      width: 660px; /* Nice proportional width */
      height: 1100px;
      overflow: hidden;
      border-radius: 40px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      margin-left: 20px;
    }

    /* Render at the native OBS canvas size so every element keeps the exact
       proportions of overlay.html, then shrink the whole thing uniformly.
       660 / 1080 = 0.61111 -> scaled width is exactly the wrapper width. */
    .game-iframe {
      position: absolute;
      top: 0; 
      left: 0;
      width: 1080px;
      height: 1920px;
      border: none;
      background: transparent;
      transform: scale(0.611111);
      transform-origin: 0 0;
    }

    .leaderboard-wrapper {
      position: relative;
      width: 320px; 
      height: 1100px; 
      overflow: hidden;
      border-radius: 30px;
      margin-right: 20px;
    }

    .leaderboard-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="mobile-stage">
    <!-- Background is set in CSS -->

    <!-- Elements -->
    <img src="./assets/mobile-banner.png" class="top-banner" />
    
    <div class="content-layer">
      <!-- Embedded Game -->
      <div class="game-wrapper">
        <iframe src="/overlay" class="game-iframe"></iframe>
      </div>
      
      <!-- Embedded Leaderboard -->
      <div class="leaderboard-wrapper">
        <iframe src="/leaderboard" class="leaderboard-iframe"></iframe>
      </div>
    </div>

    <!-- Bao -->
    <img src="./assets/mobile-bao.png" class="bao-mascot" />
  </div>

  <script>
    function scaleToFit() {
      const stage = document.querySelector('.mobile-stage');
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      
      // Calculate scale to fit 1080x1920 inside current window
      const scale = Math.min(winW / 1080, winH / 1920);
      
      // Center the stage
      const dx = (winW - 1080 * scale) / 2;
      const dy = (winH - 1920 * scale) / 2;
      
      stage.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    }

    window.addEventListener('resize', scaleToFit);
    scaleToFit(); // Initial call
  </script>
</body>
</html>
