<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ally's Stream Hub — Universal Stream Overlay</title>
  <script src="/socket.io/socket.io.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s);"></script>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <div class="universal-container">
    <!-- Active Game Iframe Frame -->
    <iframe id="gameFrame" src="/games/odd-one-out/overlay.html" allow="autoplay"></iframe>

    <!-- Transition Splash Banner -->
    <div id="switchBanner" class="switch-banner">
      <div class="banner-content">
        <span id="bannerIcon" class="banner-icon">🎮</span>
        <div class="banner-text">
          <div class="banner-sub">NOW PLAYING</div>
          <div id="bannerGameTitle" class="banner-title">Ally's Odd One Out</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./overlay.js"></script>
</body>
</html>
